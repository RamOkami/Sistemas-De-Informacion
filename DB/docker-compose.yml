services:
  postgres_db:
    image: postgres:16-alpine
    container_name: coquimbo_db_container
    restart: always
    environment:
      POSTGRES_USER: muni_user
      POSTGRES_PASSWORD: muni_password123
      POSTGRES_DB: coquimbo_incidencias
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: